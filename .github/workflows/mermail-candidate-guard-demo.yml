name: Mermail Candidate Guard Demo Video

on:
  push:
    branches: [mermail-bounty-demo-video]
    paths:
      - 'demo/render_candidate_guard_demo.py'
      - '.github/workflows/mermail-candidate-guard-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install --quiet --break-system-packages pillow

      - name: Render 2–5 minute English demo
        run: |
          set -euxo pipefail
          python3 demo/render_candidate_guard_demo.py

      - name: Validate video
        run: |
          set -euxo pipefail
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 Mermail_Candidate_Submission_Guard_Demo.mp4)
          python3 - <<'PY'
          import json, subprocess
          p = 'Mermail_Candidate_Submission_Guard_Demo.mp4'
          d = float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',p], text=True).strip())
          if not 120 <= d <= 300:
              raise SystemExit(f'Demo duration {d:.2f}s is outside the required 2–5 minute window')
          info = subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size,bit_rate:stream=index,codec_name,width,height,r_frame_rate,sample_rate,channels','-of','json',p], text=True)
          open('demo_ffprobe.json','w').write(info)
          print(f'Validated duration: {d:.2f}s')
          PY
          sha256sum Mermail_Candidate_Submission_Guard_Demo.mp4 | tee SHA256.txt

      - name: Upload exact demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mermail-Candidate-Submission-Guard-Demo
          path: |
            Mermail_Candidate_Submission_Guard_Demo.mp4
            SHA256.txt
            demo_ffprobe.json
          retention-days: 14

      - name: Publish public demo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release delete mermail-candidate-guard-demo-v1 --yes --cleanup-tag || true
          gh release create mermail-candidate-guard-demo-v1 \
            Mermail_Candidate_Submission_Guard_Demo.mp4 \
            SHA256.txt \
            demo_ffprobe.json \
            --target "$GITHUB_SHA" \
            --title "Mermail Candidate Submission Guard — Live Demo" \
            --notes "2–5 minute English demo built from the live Mermail MCP run using synthetic candidate data. AI client: ChatGPT + Mermail MCP. Skill PR: https://github.com/Nudgen-Marketing/mermail-skills/pull/467"
